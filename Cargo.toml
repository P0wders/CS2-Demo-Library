[package]
name = "cs2_demo"
version = "0.1.0"
edition = "2024"
description = "Fast, from-scratch parser for Counter-Strike 2 (.dem) demo files"
license = "Apache-2.0"

[lib]
path = "src/lib.rs"

[features]
default = []
# Serialize the stats types (MatchStats and everything in it).
serde = ["dep:serde"]
# Protobuf types for user messages, temp entities and CS game events, to decode
# what Visitor::on_net_message delivers. Off by default: they triple the
# generated code and the compile time.
user-messages = []

[dependencies]
memmap2 = "0.9.12"
prost = "0.14.6"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive", "rc"], optional = true }
snap = "1.1.2"
thiserror = "2.0.21"

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1

[profile.bench]
debug = 1

# Integration tests parse ~350 MB demos; run them optimized.
[profile.test]
opt-level = 3

[build-dependencies]
prost-build = "0.14.6"
protox = "0.10.0"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "parse"
harness = false
