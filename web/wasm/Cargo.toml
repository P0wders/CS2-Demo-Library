[package]
name = "cs2_demo_wasm"
version = "0.1.0"
edition = "2024"
description = "The match viewer's analysis: cs2_demo compiled to WebAssembly"
license = "Apache-2.0"
publish = false

# Built for wasm32-unknown-unknown by `cargo run -p cs2_demo_web`.
[lib]
crate-type = ["cdylib"]

[dependencies]
cs2_demo = { path = "../..", features = ["serde"] }
serde_json = "1.0.145"
